<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="주평예수교회 말씀암송 놀이터 · 성경 말씀을 빈칸 채우기, 순서 맞추기, 퀴즈로 재미있게 외워요">
<meta name="theme-color" content="#EAF1EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1813" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="말씀암송">
<style>body{margin:0}</style>
<title>말씀암송 놀이터 · 주평예수교회</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Jua&display=swap">
</head>
<body>
<style>
/* Layout: one phone column (max 560px), sticky top bar; game screens pin the word tray to the bottom of the screen */
:root{
  --bg:#EAF1EC; --surface:#FFFFFF; --surface-2:#DCE7DF; --ink:#1B2A22; --muted:#5A6B62; --line:#C6D5CB;
  --accent:#2E7A4E; --accent-deep:#1D5636; --accent-strong:#22613D; --accent-ink:#FFFFFF; --accent-soft:#D3EBDB;
  --gold:#E8A920; --gold-deep:#B07C0C; --gold-on:#2B1D00; --gold-soft:#F8EAC6; --gold-ink:#7E5300;
  --bad:#C2452F; --bad-soft:#F8DDD6; --good:#2E7A4E; --sky:#3B82C4; --scrim:rgba(12,24,18,.45);
  --f-display:'Jua','Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --f-body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --f-verse:'Gowun Batang','Nanum Myeongjo','AppleMyungjo','Batang',serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1813; --surface:#17231C; --surface-2:#223229; --ink:#E3EEE7; --muted:#97AB9F; --line:#2D3F35;
  --accent:#6CC08C; --accent-deep:#3F8A5D; --accent-strong:#8AD6A6; --accent-ink:#0C1A12; --accent-soft:#1E3A29;
  --gold:#EDBB45; --gold-deep:#A57F1E; --gold-on:#241800; --gold-soft:#3A2F15; --gold-ink:#F4CF73;
  --bad:#EF7C66; --bad-soft:#3F221C; --good:#6CC08C; --sky:#7DB6E8; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1813; --surface:#17231C; --surface-2:#223229; --ink:#E3EEE7; --muted:#97AB9F; --line:#2D3F35;
  --accent:#6CC08C; --accent-deep:#3F8A5D; --accent-strong:#8AD6A6; --accent-ink:#0C1A12; --accent-soft:#1E3A29;
  --gold:#EDBB45; --gold-deep:#A57F1E; --gold-on:#241800; --gold-soft:#3A2F15; --gold-ink:#F4CF73;
  --bad:#EF7C66; --bad-soft:#3F221C; --good:#6CC08C; --sky:#7DB6E8; --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px;min-height:58px}
.icon-btn{width:42px;height:42px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:none}
.icon-btn:active{background:var(--surface-2)}
.logo{color:var(--accent);display:grid;place-items:center;width:34px;height:42px;flex:none}
.top-title{flex:1;min-width:0;margin:0;font-family:var(--f-display);font-weight:400;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15}
.top-title small{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted);letter-spacing:.02em}
.adv summary{cursor:pointer;font-family:var(--f-display);font-size:16px;color:var(--muted)}
.adv[open] summary{color:var(--ink);margin-bottom:4px}
.xp-chip{font-family:var(--f-display);font-size:14px;background:var(--gold-soft);color:var(--gold-ink);padding:4px 10px;border-radius:999px;white-space:nowrap;flex:none;font-variant-numeric:tabular-nums}

main{max-width:560px;margin:0 auto;padding-block:16px 48px;display:flex;flex-direction:column;gap:16px}
.tiny{font-size:13px;color:var(--muted);margin:0}
.sec{font-family:var(--f-display);font-weight:400;font-size:18px;margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:12px;text-wrap:balance}
.sec .range{font-size:14px;color:var(--muted);white-space:nowrap}
.sec .sheet-no{color:var(--accent-strong)}

/* hero */
.hero{background:var(--accent);color:var(--accent-ink);border-radius:22px;padding:18px;display:grid;gap:16px;box-shadow:0 6px 0 var(--accent-deep)}
.hero-top{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.lv-badge{width:60px;height:60px;border-radius:50%;background:var(--accent-ink);color:var(--accent);display:grid;place-items:center;font-family:var(--f-display);font-size:28px;line-height:1;text-align:center}
.lv-badge small{display:block;font-size:12px;letter-spacing:.06em}
.lv-info{min-width:0;display:grid;gap:6px}
.lv-title{font-family:var(--f-display);font-size:22px;line-height:1.1}
.hero .bar{background:color-mix(in srgb,var(--accent-ink) 25%,transparent)}
.hero .bar i{background:var(--accent-ink)}
.hero .tiny{color:inherit;opacity:.85}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid color-mix(in srgb,var(--accent-ink) 25%,transparent);padding-top:14px}
.stat{display:grid;gap:2px;text-align:center}
.stat b{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat b em{font-style:normal;font-size:15px;opacity:.75}
.stat span{font-size:13px;opacity:.88}

.bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .35s ease}
.bar.thin{height:8px}

.cta{width:100%;display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;text-align:left;background:var(--gold);color:var(--gold-on);border:0;border-radius:20px;padding:16px 18px;box-shadow:0 5px 0 var(--gold-deep);cursor:pointer}
.cta:active{transform:translateY(3px);box-shadow:0 2px 0 var(--gold-deep)}
.cta-main{display:block;font-family:var(--f-display);font-size:22px;line-height:1.2}
.cta-sub{display:block;font-size:14px;opacity:.85}
.cta svg{width:40px;height:40px}

.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-family:var(--f-display);font-size:15px;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.group{display:grid;gap:10px}
.vlist{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.vrow{width:100%;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:0 3px 0 var(--line);cursor:pointer}
.vrow:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.num{font-family:var(--f-display);font-size:18px;width:44px;height:44px;display:grid;place-items:center;border-radius:12px;background:var(--accent-soft);color:var(--accent-strong);font-variant-numeric:tabular-nums}
.vrow.done .num{background:var(--gold);color:var(--gold-on)}
.vrow-main{min-width:0;display:grid;gap:1px}
.vrow-title{font-family:var(--f-display);font-size:16px;line-height:1.3;word-break:keep-all;overflow-wrap:anywhere}
.vrow-ref{font-size:13px;color:var(--muted)}

.pips{display:flex;gap:3px}
.pips i,.star{display:block;width:15px;height:15px;background:var(--line);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.pips i.on,.star.on{background:var(--gold)}
.star{width:26px;height:26px}

.foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding-top:8px;border-top:1px solid var(--line)}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:6px 0;font-size:13px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.keep{display:grid;gap:10px}
.keep-block{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:8px}
.keep-block>b{font-family:var(--f-display);font-weight:400;font-size:18px}
.keep-block .row{display:flex;flex-wrap:wrap;gap:8px}
.keep-block .row .btn{flex:1 1 auto}
.keep-block textarea.code,.code-in{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.45;min-height:84px;word-break:break-all;padding:10px 12px}
.code-in{width:100%;min-height:46px;font-size:18px;letter-spacing:.06em;text-transform:uppercase;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.code-in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sync-code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:21px;letter-spacing:.08em;text-align:center;background:var(--surface-2);border-radius:12px;padding:8px 10px;user-select:all}
.note{margin:0;font-size:14px;padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.note.good{background:var(--accent-soft);color:var(--accent-strong)}
.note.bad{background:var(--bad-soft);color:var(--bad)}

/* 닉네임 · 난이도 · 순위표 */
.lv-name{display:flex;align-items:center;gap:6px;font-size:14px;min-width:0}
.lv-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lv-name button{background:color-mix(in srgb,var(--accent-ink) 18%,transparent);border:0;color:inherit;border-radius:999px;padding:3px 10px;font-family:var(--f-display);font-size:13px;cursor:pointer;flex:none}
.name-in{width:100%;min-height:46px;font-size:18px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:0 12px;font-family:var(--f-body)}
.name-in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.diffbox{display:grid;gap:8px}
.diffbox .tiny{text-align:center}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface-2);border-radius:14px;padding:4px}
.seg button{border:0;border-radius:11px;background:transparent;min-height:40px;padding:4px 2px;font-family:var(--f-display);font-size:14px;cursor:pointer;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 0 var(--line)}
.seg button.d4[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.mast{display:flex;gap:6px;flex-wrap:wrap}
.mast span{font-size:12px;padding:4px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.mast span.on{background:var(--gold-soft);color:var(--gold-ink)}
.vrow-side{display:grid;gap:4px;justify-items:end}
.lvtag{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--gold-soft);color:var(--gold-ink);font-family:var(--f-display);white-space:nowrap}
.lvtag.d4{background:var(--ink);color:var(--bg)}
.gref .dchip{display:inline-block;margin-left:6px;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);vertical-align:middle;font-family:var(--f-body)}
.board{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:10px}
.board .sec{font-size:17px}
.board ol{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.board li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--surface-2)}
.board li.me{outline:2px solid var(--accent);outline-offset:-2px}
.board li.gap{background:none;text-align:center;color:var(--muted);padding:0;display:block}
.board .rk{font-family:var(--f-display);font-size:16px;color:var(--muted);text-align:center}
.board .rk.top{color:var(--gold-deep)}
.board .nm{font-family:var(--f-display);font-size:16px;line-height:1.2;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .sub{display:block;font-size:12px;color:var(--muted);font-family:var(--f-body)}
.board .xp{font-family:var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.board .row{display:flex;flex-wrap:wrap;gap:8px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:6px 16px;line-height:1.3;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--f-display);font-size:16px;cursor:pointer;box-shadow:0 3px 0 var(--line);text-align:center}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 4px 0 var(--accent-deep)}
.btn.primary:active{box-shadow:0 1px 0 var(--accent-deep)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.small{min-height:36px;font-size:14px;padding:0 12px}
.btn.danger{background:var(--bad);color:#fff;border-color:var(--bad);box-shadow:none}
.btn svg{width:18px;height:18px}

/* verse card */
.vcard{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:20px;display:grid;gap:12px}
.vc-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.num.lg{width:52px;height:52px;font-size:22px}
.vc-series{font-size:13px;color:var(--muted)}
.vc-title{font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1.25;margin:0;text-wrap:balance;word-break:keep-all}
.vc-ref{font-size:15px;color:var(--accent-strong)}
.vc-tools{display:flex;gap:8px;flex-wrap:wrap}
.verse{font-family:var(--f-verse);font-size:clamp(19px,5.2vw,22px);line-height:2;margin:0;word-break:keep-all;overflow-wrap:anywhere}
sup.vn{font-family:var(--f-display);font-size:.6em;color:var(--accent);margin-right:2px;vertical-align:super;line-height:0}
.w[data-act]{cursor:pointer}
.hid{color:transparent;background:var(--surface-2);border-radius:6px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.rest{color:transparent;background:var(--surface-2);border-radius:4px}
.peek,.peek .rest{color:var(--accent-strong);background:var(--accent-soft)}

.modes{display:grid;gap:10px}
.mode{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px}
.mode-head{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:12px;align-items:center}
.mode-head b{font-family:var(--f-display);font-weight:400;font-size:18px;display:block}
.mode-head span.d{font-size:14px;color:var(--muted);display:block}
.lv-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lvbtn.done{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-strong)}
.best{font-family:var(--f-display);font-size:14px;color:var(--muted);white-space:nowrap}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pager .btn{min-width:0;font-size:14px;padding:0 10px}
.pager .btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* games */
.gtop{display:flex;justify-content:space-between;align-items:center;gap:12px}
.gref{min-width:0}
.gref b{font-family:var(--f-display);font-weight:400;font-size:17px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gref span{font-size:13px;color:var(--muted)}
.hearts{display:flex;gap:3px;flex:none}
.heart{color:var(--bad);display:block;width:24px;height:24px}
.heart.lost{color:var(--line)}
.game-verse{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:18px}
.slot{display:inline-block;min-width:calc(var(--len,2) * .95em + 10px);height:1.45em;border-bottom:3px solid var(--line);vertical-align:-.3em;margin:0 1px;border-radius:6px 6px 0 0}
.slot.cur{border-color:var(--accent);background:var(--accent-soft);animation:pulse 1.2s ease-in-out infinite}
.slot.filled{min-width:0;height:auto;vertical-align:baseline;border-bottom-color:var(--accent);color:var(--accent-strong);padding:0 2px}
.slot.just{animation:pop .3s ease}
.tray{position:sticky;bottom:0;padding-block:14px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,transparent,var(--bg) 16px);z-index:2}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{font-family:var(--f-verse);font-size:18px;padding:8px 14px;min-height:46px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);box-shadow:0 3px 0 var(--line);cursor:pointer;color:var(--ink)}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.chip.used{opacity:.18;pointer-events:none;box-shadow:none}
.shake{animation:shake .4s ease;border-color:var(--bad)!important;background:var(--bad-soft)!important}
.built{min-height:140px}
.built .ph{color:var(--muted);font-family:var(--f-body);font-size:15px}
.pc.just{display:inline-block;animation:pop .3s ease}
.caret{display:inline-block;width:2px;height:1.1em;background:var(--accent);vertical-align:-.15em;animation:blink 1s steps(1) infinite;margin-left:2px}

.hintbox{font-family:var(--f-verse);font-size:18px;line-height:2.1;background:var(--surface);border:1.5px dashed var(--line);border-radius:16px;padding:12px 14px;word-break:keep-all}
.hintbox.off{font-family:var(--f-body);font-size:14px;color:var(--muted);line-height:1.5}
.ini{display:inline-block;min-width:1.5em;text-align:center;background:var(--accent-soft);color:var(--accent-strong);border-radius:6px;line-height:1.5}
.lbl{font-size:14px;color:var(--muted)}
textarea{width:100%;font-family:var(--f-verse);font-size:18px;line-height:1.7;padding:14px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);resize:vertical;min-height:150px}
textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1}
.gradebox{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:8px}
.pct{font-family:var(--f-display);font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.pct.ok{color:var(--good)} .pct.no{color:var(--bad)}
.miss{background:var(--bad-soft);color:var(--bad);border-radius:3px;text-decoration:underline;text-underline-offset:4px}

/* quiz */
.qtop{display:flex;gap:10px;align-items:center;font-family:var(--f-display)}
.qcount{background:var(--ink);color:var(--bg);padding:3px 12px;border-radius:99px;font-variant-numeric:tabular-nums}
.qscore{margin-left:auto;font-size:20px;font-variant-numeric:tabular-nums}
.combo{color:var(--gold-ink);background:var(--gold-soft);padding:3px 10px;border-radius:99px;animation:pop .3s ease}
.timer{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--sky);border-radius:inherit}
.timer i.low{background:var(--bad)}
.qcard{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:8px}
.q-label{font-family:var(--f-display);font-size:20px}
.q-sub{font-size:14px;color:var(--accent-strong)}
.q-title{font-family:var(--f-display);font-size:26px;line-height:1.3;color:var(--accent-strong);margin:4px 0;word-break:keep-all}
.q-verse{font-size:clamp(18px,4.8vw,20px)}
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:13px 16px;border-radius:16px;background:var(--surface);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-family:var(--f-verse);font-size:17px;line-height:1.5;cursor:pointer;min-height:54px;color:var(--ink);word-break:keep-all}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.opt.right{border-color:var(--good);background:var(--accent-soft);color:var(--accent-strong)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.opt.dim{opacity:.45}
.opt:disabled{cursor:default}
.feedback{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 10px 10px 16px;border-radius:16px;font-family:var(--f-display);font-size:18px;flex-wrap:wrap}
.feedback.good{background:var(--accent-soft);color:var(--accent-strong)}
.feedback.bad{background:var(--bad-soft);color:var(--bad)}

/* result sheet */
.backdrop{position:fixed;inset:0;background:var(--scrim);z-index:20;animation:fade .2s ease}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;background:var(--surface);border-radius:26px 26px 0 0;padding-top:24px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;text-align:center;animation:up .35s cubic-bezier(.2,.9,.3,1.15);max-height:92%;overflow:auto}
.sheet h2{font-family:var(--f-display);font-weight:400;font-size:28px;margin:0}
.sheet p{margin:0;color:var(--muted)}
.r-badge{width:68px;height:68px;border-radius:50%;margin:0 auto;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink)}
.sheet.fail .r-badge{background:var(--bad)}
.r-badge svg{width:36px;height:36px}
.r-stars{display:flex;justify-content:center;gap:6px}
.r-stars .star{width:34px;height:34px}
.r-xp{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.r-xp span{font-family:var(--f-display);background:var(--gold-soft);color:var(--gold-ink);padding:5px 12px;border-radius:99px}
.r-xp span.lvup{background:var(--accent);color:var(--accent-ink)}
.r-actions{display:grid;gap:8px;margin-top:4px}
.r-list{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.r-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.r-stats div{background:var(--surface-2);border-radius:14px;padding:10px 4px}
.r-stats b{display:block;font-family:var(--f-display);font-weight:400;font-size:24px;font-variant-numeric:tabular-nums}
.r-stats span{font-size:13px;color:var(--muted)}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
@keyframes pulse{50%{background:transparent}}
@keyframes blink{50%{opacity:0}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

const KEY='malsseum-amsong-v1';
const z4=()=>[0,0,0,0];
function blank(){return {xp:0,streak:0,lastDay:null,today:{day:null,games:0},verses:{},name:'',diff:2,sound:true,series:'all',updatedAt:0}}
// A verse record keeps b (blank cleared), o (order cleared) and t (best typing %) per difficulty, index = difficulty-1.
// Older records had one blank level 1-3, one order flag and one typing score; those map onto 쉬움/보통/어려움.
function migrateVerse(x){
  if(!x||typeof x!=='object')return null;
  if(Array.isArray(x.b))return x;
  const b=+x.b||0,o=x.o?1:0;
  return {b:[b>=1?1:0,b>=2?1:0,b>=3?1:0,0],o:[o,o,0,0],t:[+x.t||0,0,0,0],last:+x.last||0};
}
function migrateAll(vv){const out={};Object.keys(vv||{}).forEach(k=>{const m=migrateVerse(vv[k]);if(m)out[k]=m});return out}
function load(){
  try{const r=localStorage.getItem(KEY);if(r){const s=Object.assign(blank(),JSON.parse(r));s.verses=migrateAll(s.verses);s.diff=Math.min(ND,Math.max(1,+s.diff||2));s.name=String(s.name||'').slice(0,10);return s}}catch(e){}
  return blank();
}
let S=load();
function save(){S.updatedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}queueCloud();queueSync()}

function merge(a,b){
  const m=Object.assign(blank(),a);
  m.xp=Math.max(a.xp||0,b.xp||0);
  const later=(a.lastDay||'')>=(b.lastDay||'')?a:b;
  m.streak=later.streak||0;m.lastDay=later.lastDay||null;
  const ta=a.today||{},tb=b.today||{};
  m.today=(ta.day||'')>(tb.day||'')?ta:(tb.day||'')>(ta.day||'')?tb:{day:ta.day||null,games:Math.max(ta.games||0,tb.games||0)};
  m.name=((a.updatedAt||0)>=(b.updatedAt||0)?a.name:b.name)||a.name||b.name||'';
  m.verses={};
  const mx=(p,q)=>z4().map((_,i)=>Math.max(p[i]||0,q[i]||0));
  new Set([...Object.keys(a.verses||{}),...Object.keys(b.verses||{})]).forEach(k=>{
    const x=migrateVerse((a.verses||{})[k])||{b:z4(),o:z4(),t:z4()},y=migrateVerse((b.verses||{})[k])||{b:z4(),o:z4(),t:z4()};
    m.verses[k]={b:mx(x.b,y.b),o:mx(x.o,y.o),t:mx(x.t,y.t),last:Math.max(x.last||0,y.last||0)};
  });
  m.updatedAt=Math.max(a.updatedAt||0,b.updatedAt||0);
  return m;
}

function pubSummary(){
  const m=z4();VERSES.forEach(v=>{for(let d=1;d<=ND;d++)if(mastered(v.n,d))m[d-1]++});

}

// Backup/sync data is untrusted: keep only known fields with the right types
function clean(d){
  const num=x=>Math.max(0,Math.floor(+x||0)),day=x=>typeof x==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x)?x:null;
  const arr=(a,cap)=>z4().map((_,i)=>Array.isArray(a)?Math.min(cap,num(a[i])):0);
  const o={xp:num(d.xp),streak:num(d.streak),lastDay:day(d.lastDay),today:{day:day(d.today&&d.today.day),games:num(d.today&&d.today.games)},
    name:String(d.name||'').replace(/[<>]/g,'').trim().slice(0,10),verses:{},updatedAt:num(d.updatedAt)};
  const vv=d.verses&&typeof d.verses==='object'?d.verses:{};
  VERSES.forEach(v=>{const x=migrateVerse(vv[v.n]);if(x)o.verses[v.n]={b:arr(x.b,1),o:arr(x.o,1),t:arr(x.t,100),last:num(x.last)}});
  return o;
}
const BK='MALSSEUM1:';
const backupCode=()=>BK+btoa(unescape(encodeURIComponent(JSON.stringify(S))));
function readBackup(s){
  s=String(s).replace(/\s+/g,'');
  const i=s.indexOf(BK);if(i<0)throw 0;
  const d=JSON.parse(decodeURIComponent(escape(atob(s.slice(i+BK.length)))));
  if(!d||typeof d!=='object')throw 0;
  return clean(d);
}

const SYNC_URL='';  // filled in by build-site.ps1 -SyncUrl; empty hides device sync
const SYNC_KEY=KEY+'-sync';
const CODE_ABC='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
let syncCode=(()=>{try{return localStorage.getItem(SYNC_KEY)||''}catch(e){return ''}})();
const sync={busy:false,dirty:false,timer:null,at:0,err:''};
const fmtCode=c=>c.replace(/(.{4})(?=.)/g,'$1-');
const cleanCode=s=>String(s).toUpperCase().replace(/[^A-Z0-9]/g,'');
function newCode(){return [...crypto.getRandomValues(new Uint8Array(12))].map(x=>CODE_ABC[x%32]).join('')}
function syncFetch(method,body,headers={}){
  const o={method,cache:'no-store',headers};
  if(body){o.body=JSON.stringify(body);o.headers=Object.assign({'Content-Type':'application/json'},headers);o.keepalive=true}
  return fetch(SYNC_URL.replace(/\/+$/,'')+'/v1/p/'+syncCode,o);
}
function queueSync(){if(!SYNC_URL||!syncCode)return;clearTimeout(sync.timer);sync.timer=setTimeout(syncNow,2000)}
// Pull, merge, push back; ETag guards against two phones writing at once
async function syncNow(){
  if(!SYNC_URL||!syncCode)return;
  clearTimeout(sync.timer);sync.timer=null;
  if(sync.busy){sync.dirty=true;return}
  sync.busy=true;
  try{
    for(let tries=0;tries<3;tries++){
      const g=await syncFetch('GET');
      let tag=null;
      if(g.status===200){const remote=clean(await g.json());S=merge(S,remote);tag=g.headers.get('ETag')}
      else if(g.status!==404)throw g.status;
      S.pub=S.name?pubSummary():null;
      const p=await syncFetch('PUT',S,tag?{'If-Match':tag}:{'If-None-Match':'*'});
      if(p.status===412)continue;
      if(!p.ok)throw p.status;
      break;
    }
    try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    sync.at=Date.now();sync.err='';
  }catch(e){sync.err=e===429?'잠시 후 다시 동기화할게요':'동기화 서버에 연결할 수 없어요'}
  sync.busy=false;
  if(view.name==='home')render();
  if(sync.dirty){sync.dirty=false;syncNow()}
  else if(!sync.err)loadBoard();
}

/* ---------- 친구들 순위표 ---------- */
const board={rows:null,at:0,busy:false,err:''};
let myId='';
// the server lists each entry under a short hash of its sync code, so the page can mark my own row without sending the code
async function computeId(){
  myId='';
  if(!syncCode||!crypto.subtle)return;
  try{const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(syncCode));myId=[...new Uint8Array(h)].slice(0,5).map(b=>b.toString(16).padStart(2,'0')).join('')}catch(e){}
}
async function loadBoard(force){
  if(!SYNC_URL||!syncCode||!S.name||board.busy)return;
  if(!force&&Date.now()-board.at<60000)return;
  board.busy=true;
  try{
    const r=await fetch(SYNC_URL.replace(/\/+$/,'')+'/v1/board',{cache:'no-store'});
    if(!r.ok)throw 0;
    const j=await r.json();
    board.rows=(Array.isArray(j.rows)?j.rows:[]).slice(0,50).map(x=>({id:String(x.id||''),name:String(x.name||'').slice(0,10),xp:+x.xp||0,lv:+x.lv||1,streak:+x.streak||0,m:z4().map((_,i)=>+(x.m||[])[i]||0)}));
    board.err='';board.at=Date.now();
  }catch(e){board.err='순위표를 불러오지 못했어요'}
  board.busy=false;
  if(view.name==='home')render();
}
function boardRow(r,i){

    <span class="xp">${r.xp.toLocaleString()} XP</span></li>`;

function boardView(){

// Accounts: a nickname and a 4-6 digit PIN. The server answers with the progress code the
// rest of the sync code uses; the phone keeps that code and never sees the PIN again.
const PIN_RE=/^[0-9]{4,6}$/;
async function acctPost(path,body){
  const r=await fetch(SYNC_URL.replace(/\/+$/,'')+path,{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  let j=null;try{j=await r.json()}catch(e){}
  return {status:r.status,j};
}
async function account(kind){
  const name=ui.acctName.trim(),pin=ui.pin;
  if(name.length<2||name.length>10){ui.msg={k:'bad',t:'닉네임은 2~10자로 정해 주세요.'};render();return}
  if(!PIN_RE.test(pin)){ui.msg={k:'bad',t:'비밀번호는 숫자 4~6자리예요.'};render();return}
  if(kind==='signup'&&pin!==ui.pin2){ui.msg={k:'bad',t:'비밀번호 확인이 달라요. 같은 숫자를 두 번 넣어 주세요.'};render();return}
  ui.syncBusy=true;ui.msg=null;render();
  try{
    const {status,j}=await acctPost(kind==='signup'?'/v1/signup':'/v1/login',{name,pin});
    if(status===409)throw '이미 쓰고 있는 닉네임이에요. 내 진도라면 "불러오기"를, 아니면 다른 이름을 정해 주세요.';
    if(status===404)throw '그 닉네임으로 저장된 진도가 없어요. 처음이라면 "저장 시작하기"를 눌러 주세요.';
    if(status===401)throw '비밀번호가 맞지 않아요.';
    if(status===429)throw '여러 번 틀렸어요. 10분 뒤에 다시 해 보세요.';
    if(status===400)throw j&&j.error==='name'?'닉네임에 쓸 수 없는 글자가 있어요.':'비밀번호는 숫자 4~6자리예요.';
    if(!(status===200||status===201)||!j||!j.code)throw 0;
    S.name=String(j.name).slice(0,10);syncCode=String(j.code);
    try{localStorage.setItem(SYNC_KEY,syncCode)}catch(e){}
    ui.panel=null;ui.pin='';ui.pin2='';
    await syncNow();
    ui.msg=sync.err?{k:'',t:'계정은 만들어졌지만 아직 저장하지 못했어요. 인터넷이 되면 자동으로 저장돼요.'}

function dayStr(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function yesterday(){const d=new Date();d.setDate(d.getDate()-1);return dayStr(d)}

const todayGames=()=>S.today&&S.today.day===dayStr()?S.today.games:0;
function recordGame(xp){
  const t=dayStr();
  if(S.lastDay!==t){S.streak=S.lastDay===yesterday()?S.streak+1:1;S.lastDay=t}
  if(!S.today||S.today.day!==t)S.today={day:t,games:0};
  S.today.games++;S.xp+=xp;save();
}
const vs=n=>S.verses[n]||(S.verses[n]={b:z4(),o:z4(),t:z4(),last:0});
function stars(n,d=S.diff){const x=S.verses[n];if(!x)return [false,false,false];const i=d-1;return [!!x.b[i],!!x.o[i],(x.t[i]||0)>=DIFF[d].pass]}
const starCount=(n,d)=>stars(n,d).filter(Boolean).length;
const mastered=(n,d)=>starCount(n,d)===3;

let ac=null;
function unlockAudio(){if(!S.sound)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}
function tone(f,t0,d,type='sine',g=.08){const o=ac.createOscillator(),gn=ac.createGain();o.type=type;o.frequency.value=f;gn.gain.setValueAtTime(g,ac.currentTime+t0);gn.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+t0+d);o.connect(gn).connect(ac.destination);o.start(ac.currentTime+t0);o.stop(ac.currentTime+t0+d+.03)}
function sfx(k){if(!S.sound||!ac)return;try{
  if(k==='ok'){tone(660,0,.12);tone(990,.07,.16)}
  else if(k==='bad'){tone(170,0,.24,'triangle',.12)}
  else if(k==='win'){[523,659,784,1047].forEach((f,i)=>tone(f,i*.09,.28))}
}catch(e){}}
function buzz(){try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}}
// Read-aloud: a real recording (audio/<n>.mp3, listed in audio/manifest.json) when there is one, else the phone's best Korean voice
const canSpeak='speechSynthesis' in window;
let RECORDED=new Set(),player=null;
fetch('audio/manifest.json',{cache:'no-store'}).then(r=>r.ok?r.json():[]).then(a=>{RECORDED=new Set(Array.isArray(a)?a.map(Number):[]);if(view.name==='verse')render()}).catch(()=>{});
const hasVoice=v=>RECORDED.has(v.n)||canSpeak;
function koVoice(){
  const vs=speechSynthesis.getVoices().filter(x=>/^ko/i.test(x.lang));
  // the newer neural/enhanced voices sound far less robotic than the default
  const score=x=>(/yuna|sora|premium|enhanced|natural|neural|google/i.test(x.name)?2:0)+(x.localService?0:1);
  return vs.sort((a,b)=>score(b)-score(a))[0]||null;
}
function speak(v){
  stopSpeech();
  if(RECORDED.has(v.n)){player=new Audio(`audio/${v.n}.mp3`);player.play().catch(()=>speakTts(v));return}
  speakTts(v);
}
function speakTts(v){try{const u=new SpeechSynthesisUtterance(ref(v)+'. '+fullText(v));u.lang='ko-KR';u.rate=.92;const vo=koVoice();if(vo)u.voice=vo;speechSynthesis.speak(u)}catch(e){}}
function stopSpeech(){try{if(player){player.pause();player=null}if(canSpeak)speechSynthesis.cancel()}catch(e){}}
if(canSpeak)speechSynthesis.onvoiceschanged=()=>{};

const fx=$('#fx');
const reduceMotion=()=>window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function celebrate(){
  if(reduceMotion())return;
  const dpr=window.devicePixelRatio||1,ctx=fx.getContext('2d');
  const W=fx.width=innerWidth*dpr,H=fx.height=innerHeight*dpr;fx.hidden=false;
  const cs=getComputedStyle(document.documentElement);
  const cols=['--accent','--gold','--sky','--bad'].map(k=>cs.getPropertyValue(k).trim());
  const P=Array.from({length:120},()=>({x:W/2+(Math.random()-.5)*W*.4,y:H*.62,vx:(Math.random()-.5)*15*dpr,vy:-(Math.random()*15+9)*dpr,r:(Math.random()*5+3)*dpr,a:Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();
  (function f(t){const k=(t-t0)/1700;ctx.clearRect(0,0,W,H);if(k>=1){fx.hidden=true;return}
    P.forEach(p=>{p.vy+=.45*dpr;p.x+=p.vx;p.y+=p.vy;p.a+=.2;ctx.globalAlpha=Math.max(0,1-k);ctx.fillStyle=p.c;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);ctx.restore()});
    requestAnimationFrame(f)})(t0);
}

/* ---------- 공통 게임 UI ---------- */
// at 어려움 the reference is hidden, at 오직말씀 the title too
function gref(v){
  const df=DIFF[G.d];
  return `<div class="gref"><b>${G.d>=4?`${v.n}번 구절`:`${v.n}. ${esc(v.t)}`}<span class="dchip">${df.name}</span></b><span>${df.ref?ref(v):'장·절은 비밀이에요'}</span></div>`;
}
function gameTop(v,done,total){
  return `<div class="gtop">${gref(v)}
    <div class="hearts" aria-label="남은 기회 ${G.hearts}개">${Array.from({length:G.maxH},(_,i)=>ICON.heart.replace('class="heart"',`class="heart ${i<G.hearts?'':'lost'}"`)).join('')}</div></div>
    <div class="bar thin"><i style="width:${total?done/total*100:0}%"></i></div>`;
}
function btns(list){return list.map(([label,act,cls,extra])=>`<button class="btn ${cls||''}" data-act="${act}" ${extra||''}>${label}</button>`).join('')}
function resultSheet(){
  const r=G.result;
  const st=G.n?`<div class="r-stars" aria-label="이 구절의 별">${stars(G.n).map(on=>`<span class="star ${on?'on':''}"></span>`).join('')}</div>`:'';
  return `<div class="backdrop"></div>
  <div class="sheet gut ${r.pass?'pass':'fail'}" role="dialog" aria-modal="true" aria-labelledby="rt">
    <div class="r-badge">${r.pass?ICON.check:ICON.retry}</div>
    <h2 id="rt">${r.title}</h2>
    <p>${r.msg}</p>
    ${st}
    ${r.extra||''}
    <div class="r-xp"><span>+${r.xp} XP</span>${r.newStar?'<span>새 별 획득</span>':''}${r.levelUp?`<span class="lvup">레벨 업! Lv.${lvl().L} ${lvl().title}</span>`:''}</div>
    <div class="r-actions">${r.actions}</div>
  </div>`;
}
function wrapResult(n,starIdx,before,lvBefore,base){
  const after=stars(n);
  base.newStar=starIdx>=0&&!before[starIdx]&&after[starIdx];
  base.levelUp=lvl().L>lvBefore;
  if(base.pass&&!before.every(Boolean)&&after.every(Boolean)){base.title=`${DIFF[S.diff].name} 정복!`;base.msg+=` ${DIFF[S.diff].name} 난이도의 별 3개를 모두 모았어요.${S.diff<ND?' 다음 난이도에도 도전해 보세요.':''}`}
  return base;
}
function failResult(xp){
  const lvB=lvl().L;recordGame(xp);
  G.result={pass:false,title:'아쉬워요',msg:'기회를 모두 썼어요. 구절을 한 번 더 읽고 다시 도전해 봐요.',xp,levelUp:lvl().L>lvB,
    actions:btns([['다시 하기','retry','primary'],['구절 다시 읽기','toVerse','ghost']])};
  render();
}

/* ---------- 빈칸 채우기 ---------- */
function startBlank(n){
  const d=S.diff,df=DIFF[d],v=byN(n),t=toks(v);
  const cand=t.map((x,i)=>i).filter(i=>norm(t[i].w).length>=(d>=3?1:2));
  const k=Math.min(cand.length,Math.max(2,Math.round(t.length*df.ratio)));
  const blanks=d>=4?t.map((x,i)=>i):pick(cand,k).sort((a,b)=>a-b);
  const own=new Set(t.map(x=>norm(x.w)));
  const pool=[...new Set(VERSES.filter(x=>x.n!==n).flatMap(x=>toks(x).map(y=>norm(y.w))))].filter(w=>w.length>=2&&!own.has(w));
  const chips=shuffle([...blanks.map(i=>norm(t[i].w)),...pick(pool,df.dist)]).map(w=>({w,used:false}));
  const maxH=d>=4?5:3;  // a whole verse one word at a time deserves a couple more hearts
  G={type:'blank',n,d,t,blanks,cur:0,chips,hearts:maxH,maxH,mistakes:0,result:null};
  go({name:'blank',n});
}
function blankView(){
  const v=byN(G.n);
  const text=G.t.map((x,i)=>{
    const bi=G.blanks.indexOf(i),vn=vnHtml(x);
    if(bi<0)return vn+esc(x.w);
    if(bi<G.cur)return vn+`<span class="slot filled ${bi===G.cur-1?'just':''}">${esc(x.w)}</span>`;
    return vn+`<span class="slot ${bi===G.cur?'cur':''}" style="--len:${norm(x.w).length}"></span>`;
  }).join(' ');
  return gameTop(v,G.cur,G.blanks.length)+`<p class="verse game-verse">${text}</p>
    <div class="tray"><div class="chips">${G.chips.map((c,i)=>`<button class="chip ${c.used?'used':''}" data-act="chip" data-i="${i}" ${c.used?'disabled aria-hidden="true"':''}>${esc(c.w)}</button>`).join('')}</div></div>`;
}
function onChip(i){
  if(!G||G.result)return;
  const c=G.chips[i];if(!c||c.used)return;
  const want=norm(G.t[G.blanks[G.cur]].w);
  if(c.w===want){
    c.used=true;G.cur++;
    if(G.cur>=G.blanks.length)return finishBlank();
    sfx('ok');render();
  }else{
    G.hearts--;G.mistakes++;sfx('bad');buzz();
    if(G.hearts<=0)return failResult(2);
    render();flash(`[data-act="chip"][data-i="${i}"]`,'shake');
  }
}
function finishBlank(){
  const n=G.n,d=G.d,x=vs(n),before=stars(n),lvB=lvl().L,perfect=G.mistakes===0,xp=Math.round(20*DIFF[d].mult)+(perfect?10:0);
  x.b[d-1]=1;x.last=Date.now();recordGame(xp);
  G.result=wrapResult(n,0,before,lvB,{pass:true,title:perfect?'완벽해요!':'통과!',msg:`빈칸 채우기(${DIFF[d].name})를 마쳤어요${perfect?' · 실수 없이 성공':''}.`,xp,
    actions:btns([['순서 맞추기 도전','order','primary',`data-n="${n}"`],['다시 하기','retry'],['구절로 돌아가기','toVerse','ghost']])});
  render();celebrate();sfx('win');
}

/* ---------- 순서 맞추기 ---------- */
function startOrder(n){
  const d=S.diff,t=toks(byN(n)),size=Math.min(DIFF[d].chunk,t.length<=10?1:t.length<=22?2:3),chunks=[];
  let cur=null;
  t.forEach(x=>{if(!cur||x.vn||cur.ws.length>=size){cur={ws:[],vn:x.vn};chunks.push(cur)}cur.ws.push(x.w)});
  chunks.forEach((c,i)=>{c.id=i;c.text=c.ws.join(' ');c.key=norm(c.text)});
  let order=shuffle(chunks.map(c=>c.id));
  if(order.length>2&&order.every((id,i)=>id===i))order=shuffle(order);
  const maxH=d>=4?5:3;
  G={type:'order',n,d,chunks,order,used:new Set(),placed:0,hearts:maxH,maxH,mistakes:0,result:null};
  go({name:'order',n});
}
function orderView(){
  const v=byN(G.n);
  const built=G.chunks.slice(0,G.placed).map((c,i)=>vnHtml(c)+`<span class="pc ${i===G.placed-1?'just':''}">${esc(c.text)}</span>`).join(' ');
  return gameTop(v,G.placed,G.chunks.length)+
    `<p class="verse game-verse built">${G.placed?built:'<span class="ph">아래 조각을 말씀 순서대로 눌러 보세요.</span>'}<span class="caret"></span></p>
    <div class="tray"><div class="chips">${G.order.map(id=>{const c=G.chunks[id],u=G.used.has(id);return `<button class="chip ${u?'used':''}" data-act="piece" data-i="${id}" ${u?'disabled aria-hidden="true"':''}>${esc(c.text)}</button>`}).join('')}</div></div>`;
}
function onPiece(id){
  if(!G||G.result||G.used.has(id))return;
  const want=G.chunks[G.placed];
  if(G.chunks[id].key===want.key){
    G.used.add(id);G.placed++;
    if(G.placed>=G.chunks.length)return finishOrder();
    sfx('ok');render();
  }else{
    G.hearts--;G.mistakes++;sfx('bad');buzz();
    if(G.hearts<=0)return failResult(2);
    render();flash(`[data-act="piece"][data-i="${id}"]`,'shake');
  }
}
function finishOrder(){
  const n=G.n,d=G.d,x=vs(n),before=stars(n),lvB=lvl().L,perfect=G.mistakes===0,xp=Math.round(25*DIFF[d].mult)+(perfect?10:0);
  x.o[d-1]=1;x.last=Date.now();recordGame(xp);
  G.result=wrapResult(n,1,before,lvB,{pass:true,title:perfect?'완벽해요!':'통과!',msg:`말씀 조각을 모두 맞췄어요${perfect?' · 실수 없이 성공':''}.`,xp,
    actions:btns([['직접 써보기 도전','type','primary',`data-n="${n}"`],['다시 하기','retry'],['구절로 돌아가기','toVerse','ghost']])});
  render();celebrate();sfx('win');
}

/* ---------- 직접 써보기 ---------- */
function startType(n){G={type:'type',n,d:S.diff,hint:DIFF[S.diff].hint==='on',input:'',res:null,passed:false,recorded:false,result:null};go({name:'type',n})}
function grade(v,input){
  const orig=fullText(v),oc=[],pos=[];
  [...orig].forEach((ch,i)=>{if(!SKIP.test(ch)){oc.push(ch);pos.push(i)}});
  const ic=[...input].filter(ch=>!SKIP.test(ch));
  const n=oc.length,m=ic.length;
  const dp=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=oc[i]===ic[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const hit=new Set();let i=0,j=0;
  while(i<n&&j<m){if(oc[i]===ic[j]){hit.add(pos[i]);i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++}
  const L=dp[0][0];
  return {score:n+m?Math.round(200*L/(n+m)):0,hit,orig,missed:n-L,extra:m-L};
}
function gradeHtml(r){
  const chars=[...r.orig];let out='',inMiss=false;
  chars.forEach((ch,i)=>{
    const miss=!SKIP.test(ch)&&!r.hit.has(i);
    if(miss&&!inMiss){out+='<mark class="miss">';inMiss=true}
    if(!miss&&inMiss){out+='</mark>';inMiss=false}
    out+=esc(ch);
  });
  if(inMiss)out+='</mark>';
  return out;
}
function typeView(){
  const v=byN(G.n),t=toks(v),r=G.res,df=DIFF[G.d],pass=df.pass;
  const hint=t.map(x=>vnHtml(x)+`<span class="ini">${esc([...norm(x.w)||x.w][0])}</span>`).join(' ');
  return `<div class="gtop">${gref(v)}</div>
  ${df.hint==='none'?'':`<div class="hintbox ${G.hint?'':'off'}" aria-label="첫 글자 힌트">${G.hint?hint:'힌트를 껐어요. 힌트 없이 통과하면 보너스 XP를 받아요.'}</div>`}
  <label class="lbl" for="typeBox">기억나는 대로 구절을 써 보세요. 띄어쓰기와 문장부호는 채점하지 않아요.</label>
  <textarea id="typeBox" rows="6" lang="ko" maxlength="600" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="여기에 구절을 써 보세요">${esc(G.input)}</textarea>
  <div class="row">${df.hint==='opt'?`<button class="btn ghost" data-act="toggleHint">힌트 ${G.hint?'끄기':'켜기'}</button>`:''}<button class="btn primary" data-act="check">채점하기</button></div>
  ${r?`<section class="gradebox" id="grade" aria-live="polite">
    <div class="pct ${r.score>=pass?'ok':'no'}">${r.score}%</div>
    <p class="tiny">${r.score>=pass?`통과 기준 ${pass}%를 넘었어요.`:`${pass}% 이상이면 통과예요.`} 빠진 글자 ${r.missed}개 · 더 쓴 글자 ${r.extra}개</p>
    <p class="verse" style="font-size:18px">${gradeHtml(r)}</p>
    <p class="tiny">밑줄 친 부분이 빠졌거나 틀린 곳이에요.</p>
    <div class="row"><button class="btn" data-act="clearType">처음부터 다시 쓰기</button></div>
  </section>`:''}`;
}
function check(){
  const box=$('#typeBox');G.input=box?box.value:G.input;
  if(!G.input.trim()){flash('#typeBox','shake');return}
  const n=G.n,d=G.d,df=DIFF[d],v=byN(n),x=vs(n),before=stars(n),lvB=lvl().L;
  G.res=grade(v,G.input);
  if(G.res.score>(x.t[d-1]||0))x.t[d-1]=G.res.score;x.last=Date.now();
  if(G.res.score>=df.pass&&!G.passed){
    G.passed=true;G.recorded=true;
    const xp=Math.round(40*df.mult)+(df.hint==='opt'&&!G.hint?15:0);recordGame(xp);
    const idx=VERSES.indexOf(v),next=VERSES[idx+1];
    G.result=wrapResult(n,2,before,lvB,{pass:true,title:G.res.score===100?'한 글자도 틀리지 않았어요!':'통과!',msg:`정확도 ${G.res.score}%${G.hint?'':' · 힌트 없이 성공'}.`,xp,
      actions:btns([...(next?[[`다음 구절 · ${next.n}번`,'open','primary',`data-n="${next.n}"`]]:[]),['결과 자세히 보기','closeSheet'],['구절로 돌아가기','toVerse','ghost']])});
    render();celebrate();sfx('win');
  }else{
    if(!G.recorded){G.recorded=true;recordGame(3)}else save();
    render();sfx(G.res.score>=df.pass?'ok':'bad');
    const gEl=$('#grade');if(gEl)gEl.scrollIntoView({behavior:reduceMotion()?'auto':'smooth',block:'start'});
  }
}

/* ---------- 오늘의 도전 (퀴즈) ---------- */
const others=(v,k)=>pick(VERSES.filter(x=>x.n!==v.n),k);
function halves(v){const w=toks(v).map(x=>x.w),h=Math.ceil(w.length/2);return {a:w.slice(0,h).join(' '),b:w.slice(h).join(' ')}}
// showRef: at the easier difficulties a question shows the reference, verse number and sheet number as context; harder ones hide them
function makeQ(v,kind,showRef){
  const sup=(num)=>showRef?`<sup class="vn">${num}</sup>`:'';
  if(kind==='ref')return {n:v.n,label:'이 말씀은 어디에 있을까요?',body:`<p class="verse q-verse">${v.p.map(([num,txt])=>sup(num)+esc(txt)).join(' ')}</p>`,opts:shuffle([v,...others(v,3)]).map(x=>({label:sref(x),ok:x===v})),answer:sref(v)};
  if(kind==='title')return {n:v.n,label:'이 주제의 암송 구절은?',body:`<p class="q-title">${esc(v.t)}</p><p class="tiny">${esc(seriesOf(v.s).name)}${showRef?` · ${v.n}번`:''}</p>`,opts:shuffle([v,...others(v,3)]).map(x=>({label:sref(x),ok:x===v})),answer:sref(v)};
  if(kind==='word'){
    const t=toks(v),cand=t.map((x,i)=>i).filter(i=>norm(t[i].w).length>=2),bi=cand[Math.floor(Math.random()*cand.length)],ans=norm(t[bi].w);
    const own=new Set(t.map(x=>norm(x.w)));
    let dp=[...new Set(VERSES.flatMap(x=>toks(x).map(y=>norm(y.w))))].filter(w=>!own.has(w)&&w.length>=2);
    const near=dp.filter(w=>Math.abs(w.length-ans.length)<=1);if(near.length>=3)dp=near;
    const body=t.map((x,i)=>(x.vn?sup(x.vn):'')+(i===bi?`<span class="slot cur" style="--len:${ans.length}"></span>`:esc(x.w))).join(' ');
    return {n:v.n,label:'빈칸에 들어갈 말은?',sub:showRef?sref(v):'',body:`<p class="verse q-verse">${body}</p>`,opts:shuffle([{label:ans,ok:true},...pick(dp,3).map(w=>({label:w,ok:false}))]),answer:ans};
  }
  const me=halves(v);
  return {n:v.n,label:'이어지는 말씀은?',sub:showRef?sref(v):'',body:`<p class="verse q-verse">${esc(me.a)} …</p>`,opts:shuffle([{label:me.b,ok:true},...others(v,3).map(x=>({label:halves(x).b,ok:false}))]),answer:me.b};
}
function startQuiz(){
  const d=S.diff,df=DIFF[d];
  const pool=filtered().map(v=>({v,k:starCount(v.n)+Math.random()*1.6})).sort((a,b)=>a.k-b.k).map(o=>o.v);
  const chosen=[];for(let i=0;i<10;i++)chosen.push(pool[i%pool.length]);
  const kinds=shuffle(['ref','word','next','title','word','ref','next','word','title','next']);
  G={type:'quiz',d,qt:df.qt,qs:shuffle(chosen).map((v,i)=>makeQ(v,kinds[i],df.ref)),qi:0,score:0,combo:0,maxCombo:0,correct:0,missed:new Set(),answered:null,left:1,result:null};
  go({name:'quiz'});startTimer();
}
function quizView(){
  const q=G.qs[G.qi],a=G.answered;
  return `<div class="qtop"><span class="qcount">${G.qi+1} / ${G.qs.length}</span>${G.combo>=2?`<span class="combo">${G.combo}연속!${G.combo>=3?' ×1.5':''}</span>`:''}<span class="qscore">${G.score.toLocaleString()}점</span></div>
  <div class="timer" aria-hidden="true"><i id="tbar" class="${G.left<.25?'low':''}" style="width:${G.left*100}%"></i></div>
  <section class="qcard"><div class="q-label">${q.label}</div>${q.sub?`<div class="q-sub">${q.sub}</div>`:''}${q.body}</section>
  <div class="opts">${q.opts.map((o,i)=>`<button class="opt ${a?(o.ok?'right':(a.i===i?'wrong':'dim')):''}" data-act="ans" data-i="${i}" ${a?'disabled':''}>${esc(o.label)}</button>`).join('')}</div>
  ${a?`<div class="feedback ${a.ok?'good':'bad'}" aria-live="polite"><span>${a.ok?`정답! +${a.pts}점`:(a.i<0?'시간이 다 됐어요':'아쉬워요')}</span>${a.ok?'':`<button class="btn primary small" data-act="nextQ">${G.qi+1<G.qs.length?'다음 문제':'결과 보기'}</button>`}</div>`:''}`;
}
function startTimer(){
  clearTimers();G.t0=performance.now();G.left=1;
  const id=setInterval(()=>{
    if(!G||G.type!=='quiz')return clearTimers();
    G.left=Math.max(0,1-(performance.now()-G.t0)/G.qt);
    const el=document.getElementById('tbar');
    if(el){el.style.width=(G.left*100)+'%';el.classList.toggle('low',G.left<.25)}
    if(G.left<=0)answer(-1);
  },100);
  timers.push(()=>clearInterval(id));
}
function answer(i){
  if(!G||G.type!=='quiz'||G.answered)return;
  clearTimers();
  const q=G.qs[G.qi],ok=i>=0&&q.opts[i].ok,secs=G.left*G.qt/1000;let pts=0;
  if(ok){G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);G.correct++;pts=Math.round((100+secs*5)*(G.combo>=3?1.5:1));G.score+=pts;sfx('ok')}
  else{G.combo=0;G.missed.add(q.n);sfx('bad');buzz()}
  G.answered={i,ok,pts};render();
  if(ok){const id=setTimeout(nextQ,950);timers.push(()=>clearTimeout(id))}
}
function nextQ(){
  clearTimers();
  if(G.qi+1>=G.qs.length)return finishQuiz();
  G.qi++;G.answered=null;render();startTimer();
}
function finishQuiz(){
  const lvB=lvl().L,xp=Math.max(5,Math.round(G.score/20*DIFF[G.d].mult));recordGame(xp);
  const good=G.correct>=8;
  const miss=[...G.missed].map(byN);
  G.result={pass:good,title:G.correct===10?'만점이에요!':good?'잘했어요!':'좋은 연습이었어요',msg:`10문제 중 ${G.correct}문제를 맞혔어요.`,xp,levelUp:lvl().L>lvB,
    extra:`<div class="r-stats"><div><b>${G.score.toLocaleString()}</b><span>점수</span></div><div><b>${G.correct}/10</b><span>정답</span></div><div><b>${G.maxCombo}</b><span>최고 연속</span></div></div>
    ${miss.length?`<p>다시 볼 구절</p><div class="r-list">${miss.map(v=>`<button class="btn small" data-act="open" data-n="${v.n}">${v.n}. ${esc(v.t)}</button>`).join('')}</div>`:''}`,
    actions:btns([['한 번 더 도전','quiz','primary'],['처음 화면으로','home','ghost']])};
  render();if(good){celebrate();sfx('win')}
}

/* ---------- 이벤트 ---------- */
function back(){
  if(view.name==='verse'){go({name:'home'});return}
  if(view.name==='quiz'){G=null;go({name:'home'});return}
  const n=view.n;G=null;go({name:'verse',n});
}
function retry(){
  if(!G)return;
  if(G.type==='blank')startBlank(G.n);
  else if(G.type==='order')startOrder(G.n);
  else if(G.type==='type')startType(G.n);
  else startQuiz();
}
function openVerse(n){G=null;ui.hide=0;ui.peek=new Set();go({name:'verse',n})}
app.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el||el.disabled)return;
  unlockAudio();
  const a=el.dataset.act,n=+el.dataset.n||view.n,i=+el.dataset.i;
  if(/^(bk|sync|panel|signup|login|logout|toKeep)/.test(a))ui.msgAt=/^bk/.test(a)||el.dataset.p==='restore'?'bk':'sync';
  switch(a){
    case 'back':back();break;
    case 'sound':S.sound=!S.sound;save();if(S.sound)unlockAudio();render();break;
    case 'series':S.series=el.dataset.id;save();render();break;
    case 'open':openVerse(n);break;
    case 'hide':cycleHide(byN(view.n));render();break;
    case 'peek':ui.peek.has(i)?ui.peek.delete(i):ui.peek.add(i);render();break;
    case 'speak':speak(byN(view.n));break;
    case 'blank':startBlank(n);break;
    case 'diff':S.diff=+el.dataset.d;save();render();break;
    case 'nameSave':S.name=ui.nameIn.trim().replace(/[<>]/g,'').slice(0,10);ui.panel=null;save();render();if(S.name)loadBoard(true);break;
    case 'nameClear':S.name='';ui.panel=null;save();render();break;
    case 'boardRefresh':board.at=0;board.rows=null;render();loadBoard(true);break;
    case 'toKeep':ui.panel='signup';ui.acctName=S.name;ui.msg=null;render();{const k=$('.keep');if(k)k.scrollIntoView({behavior:reduceMotion()?'auto':'smooth',block:'start'});const f=$('#acctName');if(f&&!f.value)f.focus()}break;
    case 'signup':case 'login':account(a);break;
    case 'logout':logout();render();break;
    case 'order':startOrder(n);break;
    case 'type':startType(n);break;
    case 'chip':onChip(i);break;
    case 'piece':onPiece(i);break;
    case 'toggleHint':{const b=$('#typeBox');if(b)G.input=b.value;G.hint=!G.hint;render();break}
    case 'check':check();break;
    case 'clearType':G.input='';G.res=null;render();{const b=$('#typeBox');if(b)b.focus()}break;
    case 'closeSheet':G.result=null;render();{const g=$('#grade');if(g)g.scrollIntoView({block:'start'})}break;
    case 'retry':retry();break;
    case 'toVerse':openVerse(G?G.n:view.n);break;
    case 'quiz':startQuiz();break;
    case 'home':G=null;go({name:'home'});break;
    case 'ans':answer(i);break;
    case 'nextQ':nextQ();break;
    case 'reset':ui.confirmReset=true;render();break;
    case 'resetNo':ui.confirmReset=false;render();break;
    case 'resetYes':S=Object.assign(blank(),{sound:S.sound,series:S.series,name:S.name,diff:S.diff});ui.confirmReset=false;save();render();
      // merging would bring the old record back, so overwrite the server copy
      if(SYNC_URL&&syncCode){clearTimeout(sync.timer);syncFetch('PUT',S).catch(()=>{})}
      break;
    case 'panel':ui.panel=el.dataset.p;ui.msg=null;if(ui.panel==='name')ui.nameIn=S.name;if(ui.panel==='signup'||ui.panel==='login'){ui.acctName=ui.acctName||S.name;ui.pin='';ui.pin2=''}render();{const f=$('#bkIn')||$('#nameIn')||$('#acctName');if(f)f.focus()}break;
    case 'panelClose':ui.panel=null;ui.msg=null;render();break;
    case 'bkMake':ui.bk=backupCode();ui.panel='backup';ui.msg=null;render();
      copyText(ui.bk).then(ok=>{ui.msg={k:ok?'good':'',t:ok?'백업 코드를 복사했어요.':'아래 코드를 길게 눌러 전체 선택 후 복사해 주세요.'};render();if(!ok){const t=$('#bkOut');if(t)t.select()}});break;
    case 'bkCopy':copyText(ui.bk).then(ok=>{ui.msg={k:ok?'good':'',t:ok?'백업 코드를 복사했어요.':'아래 코드를 길게 눌러 전체 선택 후 복사해 주세요.'};render()});break;
    case 'bkLoad':
      try{S=merge(S,readBackup(ui.bkIn));save();ui.panel=null;ui.bkIn='';ui.msg={k:'good',t:'백업을 불러왔어요!'};sfx('ok')}
      catch(err){ui.msg={k:'bad',t:'백업 코드가 올바르지 않아요. 코드 전체를 빠짐없이 붙여 넣었는지 확인해 주세요.'};sfx('bad')}
      render();break;
    case 'syncNow':sync.at=0;render();syncNow();break;
  }
});
app.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"][data-act]')){e.preventDefault();e.target.click()}
  if(e.key==='Enter'&&/^(nameIn|acctName|pin|pin2)$/.test(e.target.id)){e.preventDefault();const b=$(e.target.id==='nameIn'?'[data-act="nameSave"]':'[data-act="signup"],[data-act="login"]');if(b)b.click()}
});
app.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='typeBox'&&G)G.input=t.value;
  else if(t.id==='bkIn')ui.bkIn=t.value;
  else if(t.id==='nameIn')ui.nameIn=t.value;
  else if(t.id==='acctName')ui.acctName=t.value;
  else if(t.id==='pin')ui.pin=t.value.replace(/\D/g,'');
  else if(t.id==='pin2')ui.pin2=t.value.replace(/\D/g,'');
});
app.addEventListener('toggle',e=>{if(e.target.matches('details.adv'))ui.adv=e.target.open},true);
// pick up progress from the other phone when coming back; push before the app goes to the background
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'||sync.timer)syncNow()});

render();
initCloud();
computeId().then(()=>{syncNow();loadBoard()});
</script>

if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
